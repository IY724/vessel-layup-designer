name: 功能需求 / 其他问题
description: 界面交互、导出、几何板块、与 Abaqus 插件对接等改进
labels: ["needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 场景与现状，而不是直接给方案
      placeholder: 做系列方案时要反复改层数、手抄结果，容易错
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
      description: 可选；涉及计算口径的请说明与现有基准测试的关系
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      multiple: true
      options:
        - 计算核心 src/core
        - 输入面板
        - 筒身铺层表
        - 封头可视化
        - 自动生成
        - 导出（Excel / JSON）
        - 几何板块（二期）
        - Abaqus 插件对接（二期）
        - 分发 / 构建
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: 验收标准
      description: 怎样算做完了（含需要新增/修改哪些基准测试）
      placeholder: npm test 全绿；新增断言覆盖 …
    validations:
      required: true
